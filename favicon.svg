<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="g" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#c77dff"/>
      <stop offset="60%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#5a189a"/>
    </radialGradient>
    <radialGradient id="shine" cx="35%" cy="30%" r="40%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <!-- Gem shape (rotated square / diamond) -->
  <polygon points="16,2 30,16 16,30 2,16" fill="url(#g)" filter="drop-shadow(0 2px 4px rgba(157,78,221,0.8))"/>
  <!-- Shine highlight -->
  <polygon points="16,2 30,16 16,30 2,16" fill="url(#shine)" opacity="0.6"/>
  <!-- Inner sparkle -->
  <text x="16" y="20" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.7)">✦</text>
</svg>
